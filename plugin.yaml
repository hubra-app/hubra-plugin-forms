id: forms
name: Forms
version: "1.1.0"
hubra: ">=0.2.5,<1"
description: "Forms and surveys: the board builds a form (camp sign-up, kit sizes, a satisfaction survey), members fill it in, and the answers come back as a summary, a table or a CSV."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-forms
tags: [forms, surveys, sign-up, questionnaire]
package: hubra_forms
modules: [forms]
requires: [members]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, jobs, nav, frontend]
